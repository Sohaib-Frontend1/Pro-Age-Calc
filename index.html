<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="./birth-calc.jpg" type="image/jpg">
        <link rel="stylesheet" href="style.css" />
        <title>Age Calculator</title>
    </head>
    <body>
        <div class="app">
            <h1>Age Calculator</h1>
            <p class="txt">Enter your birth date to calculate your age.</p>
            <input type="date" id="inputBirthDate" />
            <br />
            <button id="calbtn" class="btn">Calculate your age</button>
            <button class="btn" id="calcBirthday">Find out your next birthday</button>
            <p id="result"></p>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
